<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>KinderTV ontvanger</title>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--nacht:#16244F;--zon:#FFC93C;--wit:#F3F6FF}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:"Baloo 2",ui-rounded,"Arial Rounded MT Bold",sans-serif}
  /* Het speelvlak is hoger dan het scherm: de titelbalk en de knoppenbalk van YouTube vallen buiten beeld */
  #spelerdoos{position:absolute;left:0;right:0;top:-130px;bottom:-130px;z-index:2;background:#000}
  /* Tweede, onzichtbare speler die afleveringen vooraf meet */
  #meterdoos{position:absolute;left:0;top:0;width:320px;height:180px;z-index:1}
  #spelerdoos iframe,#meterdoos iframe{width:100%;height:100%;border:0}
  .scherm{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;transition:opacity .6s}
  .uit{opacity:0;pointer-events:none}

  #welkom{background:var(--nacht);color:var(--wit)}
  #welkom h1{font-size:130px;line-height:1;color:var(--zon);margin:0;font-weight:800}
  #welkom p{font-size:38px;margin:14px 0 46px;opacity:.85}
  #gids{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;max-width:1500px;padding:0 60px}
  .chip{display:flex;align-items:center;gap:14px;font-size:32px;font-weight:700;
    padding:8px 28px 8px 10px;border-radius:999px;background:rgba(255,255,255,.1)}
  .chip i{width:44px;height:44px;border-radius:50%}

  #kaart{color:var(--nacht);transition:opacity .6s, background .6s}
  #kKlein{font-size:44px;font-weight:500}
  #kNaam{font-size:124px;font-weight:800;line-height:.95;max-width:1600px}
  .beeldlijst{margin-top:28px;width:480px;aspect-ratio:16/9;border-radius:22px;overflow:hidden;
    background:rgba(22,36,79,.15);border:8px solid var(--nacht)}
  #kBeeld{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s}
  #kBeeld.zicht{opacity:1}
  .onder{display:flex;align-items:center;gap:22px;margin-top:26px}
  #klok{width:70px}
  #klok .ring{fill:none;stroke:var(--nacht);stroke-width:12;stroke-linecap:round;stroke-dasharray:283;
    stroke-dashoffset:283;transform:rotate(-90deg);transform-origin:50% 50%}
  #klok.loopt .ring{animation:klok linear forwards}
  @keyframes klok{to{stroke-dashoffset:0}}
  #kDaarna{font-size:34px;opacity:.75}

  #pauze{background:rgba(22,36,79,.95);color:var(--wit);font-size:60px;font-weight:800}
  #pauze svg{width:150px;margin-bottom:20px}

  #einde{background:var(--nacht);color:var(--wit)}
  #einde h2{font-size:96px;margin:20px 0 0;line-height:1;font-weight:800}
  #einde p{font-size:40px;opacity:.8}
  #status{position:absolute;right:24px;bottom:16px;z-index:20;font-size:18px;color:rgba(255,255,255,.35);font-family:sans-serif}
</style>
</head>
<body>
<div id="meterdoos"><div id="meter"></div></div>
<div id="spelerdoos"><div id="speler"></div></div>

<section id="welkom" class="scherm">
  <h1 id="wTitel">KinderTV</h1>
  <p id="wSub">Klaar voor de uitzending</p>
  <div id="gids"></div>
</section>

<section id="kaart" class="scherm uit">
  <div id="kKlein">Straks</div>
  <div id="kNaam"></div>
  <div class="beeldlijst"><img id="kBeeld" alt=""></div>
  <div class="onder">
    <svg id="klok" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(22,36,79,.18)" stroke-width="12"/>
      <circle class="ring" cx="50" cy="50" r="45"/>
    </svg>
    <div id="kDaarna"></div>
  </div>
</section>

<section id="pauze" class="scherm uit">
  <svg viewBox="0 0 10 10"><rect x="1.5" y="1" width="2.6" height="8" rx=".6" fill="#FFC93C"/><rect x="5.9" y="1" width="2.6" height="8" rx=".6" fill="#FFC93C"/></svg>
  Even pauze
</section>

<section id="einde" class="scherm uit">
  <svg width="200" viewBox="0 0 100 100" aria-hidden="true">
    <g stroke="#FFC93C" stroke-width="7" stroke-linecap="round">
      <line x1="50" y1="6" x2="50" y2="18"/><line x1="50" y1="82" x2="50" y2="94"/>
      <line x1="6" y1="50" x2="18" y2="50"/><line x1="82" y1="50" x2="94" y2="50"/>
      <line x1="19" y1="19" x2="27" y2="27"/><line x1="73" y1="73" x2="81" y2="81"/>
      <line x1="19" y1="81" x2="27" y2="73"/><line x1="73" y1="27" x2="81" y2="19"/>
    </g>
    <circle cx="50" cy="50" r="24" fill="#FFC93C"/>
    <path d="M40 54 Q50 64 60 54" stroke="#16244F" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="42" cy="45" r="3" fill="#16244F"/><circle cx="58" cy="45" r="3" fill="#16244F"/>
  </svg>
  <h2>Dat was KinderTV!</h2>
  <p>Volgende keer zijn er nieuwe afleveringen.</p>
</section>

<div id="status"></div>

<script>
const NS = "urn:x-cast:nl.zaterdagtv";
const KAART_MS = { nieuw:11000, zelfde:5000, tussen:5000 };
const ctx = cast.framework.CastReceiverContext.getInstance();
const $ = id => document.getElementById(id);
const wacht = ms => new Promise(res => setTimeout(res, ms));

let speler = null, meter = null, klaarTeller = 0, apiKlaar = false, wachtStart = null, run = 0;
let slots = [], si = 0, fase = "rust", gespeeld = 0, grens = 0, huidig = null, pauzeDoorOuder = false, nuTekst = "klaar";
let lijsten = {}, offset = {}, prep = {}, prepRes = {}, prepGen = 0, meterWacht = null;

function later(fn, ms){ const r = run; return setTimeout(() => { if(r === run) fn(); }, ms); }
function toon(id){ ["welkom","kaart","pauze","einde"].forEach(x => $(x).classList.toggle("uit", x !== id)); }
function meld(t){ $("status").textContent = t; }
function stuur(obj){ try{ ctx.sendCustomMessage(NS, undefined, obj); }catch(e){} }
function waarschuw(t){ meld(t); stuur({ type:"melding", tekst:t }); }
function stuurNu(){ stuur({ type:"nu", fase, tekst:nuTekst }); }
function foutTekst(code){ return code == 101 || code == 150 ? "inbedden niet toegestaan" : code == 100 ? "video bestaat niet meer" : code === "traag" ? "laadt niet" : "YouTube-fout " + code; }

/* ---------- Berichten van de telefoon ---------- */
ctx.addCustomMessageListener(NS, e => {
  let d = e.data;
  if(typeof d === "string"){ try{ d = JSON.parse(d); }catch(x){ return; } }
  if(d.type === "start"){ if(apiKlaar) begin(d); else wachtStart = d; }
  if(d.type === "pause" && fase === "video"){ pauzeDoorOuder = true; speler.pauseVideo(); }
  if(d.type === "resume" && fase === "video"){ speler.playVideo(); }
  if(d.type === "stop") einde();
  if(d.type === "status") stuurNu();
});
const opties = new cast.framework.CastReceiverOptions();
opties.disableIdleTimeout = true;
opties.skipPlayersLoad = true;
opties.maxInactivity = 3600;
ctx.start(opties);

/* ---------- YouTube: hoofdspeler (beeld) en meetspeler (onzichtbaar) ---------- */
const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);
const VARS = { controls:0, disablekb:1, fs:0, rel:0, iv_load_policy:3, modestbranding:1, playsinline:1, cc_load_policy:0, hl:"nl" };
function klaar(){ if(++klaarTeller < 2) return; apiKlaar = true; meld("klaar"); if(wachtStart){ begin(wachtStart); wachtStart = null; } }
window.onYouTubeIframeAPIReady = () => {
  speler = new YT.Player("speler", { width:"100%", height:"100%", playerVars:VARS,
    events:{ onReady:klaar, onStateChange:spelerStatus, onError:spelerFout } });
  meter = new YT.Player("meter", { width:"100%", height:"100%", playerVars:VARS,
    events:{ onReady:klaar, onStateChange:meterStatus, onError:meterFout } });
};
function ondertitelsUit(){
  [0, 1000, 3000].forEach(ms => setTimeout(() => {
    try{ speler.unloadModule("captions"); }catch(e){}
    try{ speler.unloadModule("cc"); }catch(e){}
    try{ speler.setOption("captions", "track", {}); }catch(e){}
  }, ms));
}

/* ---------- Meetspeler: playlists ophalen en afleveringen meten, op de achtergrond ---------- */
function meterStatus(e){
  const w = meterWacht; if(!w) return;
  if(w.soort === "lijst"){
    let pl = null; try{ pl = meter.getPlaylist(); }catch(x){}
    if(pl && pl.length){ meterWacht = null; w.klaar(pl); }
  } else if(w.soort === "meet" && e.data === YT.PlayerState.PLAYING){
    meetDuur(w, 0);
  }
}
function meetDuur(w, keer){
  if(meterWacht !== w) return;
  const d = meter.getDuration();
  if(!d && keer < 10){ setTimeout(() => meetDuur(w, keer + 1), 300); return; }
  meterWacht = null; try{ meter.stopVideo(); }catch(x){}
  w.klaar(d ? { ok:true, d } : { ok:false, code:"traag" });
}
function meterFout(e){
  const w = meterWacht; if(!w) return;
  meterWacht = null; try{ meter.stopVideo(); }catch(x){}
  w.klaar(w.soort === "lijst" ? [] : { ok:false, code:e.data });
}
function meterVraag(soort, start, ms, bijTimeout){
  return new Promise(res => {
    const w = { soort, klaar:res };
    meterWacht = w;
    setTimeout(() => { if(meterWacht === w){ meterWacht = null; try{ meter.stopVideo(); }catch(x){} res(bijTimeout); } }, ms);
    start();
    if(soort === "lijst") [1500, 4000].forEach(t => setTimeout(() => { if(meterWacht === w) meterStatus({ data:-1 }); }, t));  /* voor als YouTube geen seintje geeft */
  });
}
function haalLijst(l){
  if(!lijsten[l]) lijsten[l] = meterVraag("lijst", () => meter.cuePlaylist({ list:l, listType:"playlist", index:0 }), 10000, []);
  return lijsten[l];
}
function meet(v){
  return meterVraag("meet", () => { try{ meter.mute(); }catch(x){} meter.loadVideoById(v); }, 12000, { ok:false, code:"traag" });
}

/* Bereidt een plek voor: zoekt de eerste speelbare aflevering en meet hem. Eén plek tegelijk, op volgorde. */
function voorbereid(i){
  if(i >= slots.length) return Promise.resolve(null);
  if(prep[i]) return prep[i];
  const gen = prepGen, r = run;
  const vorige = i > 0 && prep[i-1] ? prep[i-1] : Promise.resolve();
  prep[i] = vorige.then(async () => {
    const sl = slots[i];
    const ids = await haalLijst(sl.lijst);
    if(gen !== prepGen || r !== run) return null;
    if(!ids.length){
      if(!lijsten[sl.lijst].gemeld){ lijsten[sl.lijst].gemeld = true; waarschuw(sl.naam + ": playlist laadt niet (link fout, verwijderd of privé)"); }
      return prepRes[i] = null;
    }
    for(let poging = 0; poging < 9; poging++){
      const v = ids[(sl.index + (offset[sl.lijst] || 0)) % ids.length];
      const m = await meet(v);
      if(gen !== prepGen || r !== run) return null;
      if(m.ok && m.d <= sl.maxMin * 60){ new Image().src = beeldUrl(v); return prepRes[i] = { v, d:m.d }; }
      waarschuw(sl.naam + ": aflevering overgeslagen, " + (m.ok ? "te lang (" + Math.round(m.d/60) + " min, maximaal " + sl.maxMin + ")" : foutTekst(m.code)));
      offset[sl.lijst] = (offset[sl.lijst] || 0) + 1;
    }
    waarschuw(sl.naam + ": geen speelbare aflevering gevonden");
    return prepRes[i] = null;
  });
  return prep[i];
}
function vergeetVanaf(i){ prepGen++; Object.keys(prep).forEach(k => { if(+k >= i){ delete prep[k]; delete prepRes[k]; } }); }

/* ---------- De uitzending ---------- */
function begin(d){
  run++;
  slots = d.slots || []; si = 0; gespeeld = 0; offset = {}; lijsten = {}; prep = {}; prepRes = {}; prepGen++; meterWacht = null;
  grens = ((d.doelMin || 60) + (d.spelingMin || 5)) * 60;
  try{ speler.stopVideo(); meter.stopVideo(); }catch(e){}
  const uur = new Date().getHours();
  $("wTitel").textContent = uur < 12 ? "Goedemorgen!" : uur < 18 ? "Goedemiddag!" : "Goedenavond!";
  $("wSub").textContent = "Zo meteen op KinderTV";
  $("gids").innerHTML = "";
  (d.gids || []).forEach(p => {
    const c = document.createElement("div"); c.className = "chip";
    c.innerHTML = `<i style="background:${p.kleur}"></i>`;
    c.append(p.naam + (p.aantal > 1 ? " ×" + p.aantal : ""));
    $("gids").appendChild(c);
  });
  fase = "welkom"; nuTekst = "welkom"; toon("welkom"); stuurNu();
  voorbereid(0);                      /* meten begint al tijdens het welkomstscherm */
  later(speelSlot, 8000);
}

async function speelSlot(){
  const r = run;
  while(si < slots.length && prepRes.hasOwnProperty(si) && prepRes[si] === null) si++;   /* bekend onspeelbaar: stil overslaan */
  if(si >= slots.length) return einde();
  const i = si, sl = slots[i];
  kaart(sl, prepRes[i]);
  const [res] = await Promise.all([voorbereid(i), wacht(KAART_MS[sl.soort] || 5000)]);
  if(r !== run || i !== si) return;
  if(!res){ si++; return speelSlot(); }
  if(gespeeld > 0 && gespeeld + res.d > grens) return einde();
  huidig = res; fase = "startend"; pauzeDoorOuder = false;
  try{ speler.unMute(); speler.setVolume(100); }catch(e){}
  speler.loadVideoById(res.v);
  later(() => { if(fase === "startend" && si === i){ fase = "video"; toon(null); } }, 10000);
}

function kaart(sl, res){
  fase = "kaart";
  $("kaart").style.background = sl.kleur;
  $("kKlein").textContent = { nieuw:"Straks", zelfde:"Nog een aflevering van", tussen:"Even tussendoor" }[sl.soort] || "";
  $("kNaam").textContent = sl.naam;
  $("kDaarna").textContent = sl.soort === "nieuw" ? (sl.daarna ? "Daarna: " + sl.daarna : "Daarna: tot de volgende keer") : "";
  const img = $("kBeeld");
  img.classList.remove("zicht"); img.removeAttribute("src");
  const zet = v => { if(slots[si] !== sl) return; img.onload = () => img.classList.add("zicht"); img.src = beeldUrl(v); };
  if(res) zet(res.v); else voorbereid(si).then(x => { if(x) zet(x.v); });
  const ms = KAART_MS[sl.soort] || 5000, klok = $("klok");
  klok.classList.remove("loopt"); void klok.getBBox();
  klok.querySelector(".ring").style.animationDuration = ms + "ms";
  klok.classList.add("loopt");
  toon("kaart");
  nuTekst = sl.naam + (sl.teller ? " (" + sl.teller + ")" : ""); stuurNu();
}
const beeldUrl = v => "https://i.ytimg.com/vi/" + v + "/hqdefault.jpg";

function spelerStatus(e){
  const S = YT.PlayerState;
  if(e.data === S.PLAYING) ondertitelsUit();
  if(fase === "startend" && e.data === S.PLAYING){
    fase = "video";
    later(() => { if(fase === "video" && !pauzeDoorOuder) toon(null); }, 1200);
    const volgende = si + 1;
    later(() => voorbereid(volgende), 4000);    /* volgende plek klaarzetten terwijl deze speelt */
    return;
  }
  if(fase === "video"){
    if(e.data === S.PLAYING){ pauzeDoorOuder = false; toon(null); }
    else if(e.data === S.PAUSED && pauzeDoorOuder){ toon("pauze"); }
    else if(e.data === S.ENDED){ gespeeld += huidig ? huidig.d : 0; si++; speelSlot(); }
  }
}
function spelerFout(e){
  if(!["startend","video"].includes(fase)) return;
  const sl = slots[si];
  waarschuw(sl.naam + ": aflevering overgeslagen, " + foutTekst(e.data));
  offset[sl.lijst] = (offset[sl.lijst] || 0) + 1;
  vergeetVanaf(si);
  speelSlot();
}

function einde(){
  run++; prepGen++; meterWacht = null;
  fase = "einde"; nuTekst = "afgelopen";
  try{ speler.stopVideo(); meter.stopVideo(); }catch(e){}
  toon("einde"); stuurNu();
}
</script>
</body>
</html>
